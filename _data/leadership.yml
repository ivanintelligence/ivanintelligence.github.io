- position: Research Collaborator
  time: 07/2024
  description: >
    <span class="u-ld-contrast">Soonchunhyang University</span><br><br>
    Presented and collaborated on research in deep learning and computer vision with international students from Soonchunhyang University (SCH), South Korea, amid language barriers.<br><br>
